[package]
name = "communication-hub"
version = "0.1.0"
edition = "2024"
description = "Local, channel-scoped communication and work hub"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
regex = "1.12"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
tokio-tungstenite = "0.29"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = {version="0.5",features=["util"]}
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
